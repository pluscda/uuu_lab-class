<div class="page-card">
  <div class="page-toolbar">
    <div class="page-title">
      <h2>合作廠商 Partner</h2>
      <span class="subtitle">課程合作廠商</span>
    </div>
    <div class="toolbar-actions">
      <p-button
        label="搜尋條件"
        icon="pi pi-filter"
        severity="secondary"
        [outlined]="true"
        (onClick)="filterVisible.set(true)" />
      <p-button label="新增" icon="pi pi-plus" (onClick)="add()" />
    </div>
  </div>

  <p-table
    [value]="partners()"
    [loading]="loading()"
    [paginator]="true"
    paginatorPosition="top"
    [rows]="rows"
    [first]="first"
    [rowsPerPageOptions]="[10, 20, 50]"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first}–{last} 筆，共 {totalRecords} 筆"
    [sortField]="sortField"
    [sortOrder]="sortOrder"
    (onSort)="onSort($event)"
    (onPage)="onPage($event)"
    dataKey="pkid">
    <ng-template #header>
      <tr>
        <th pSortableColumn="pkid" style="width: 90px">主代碼 <p-sortIcon field="pkid" /></th>
        <th pSortableColumn="name">廠商名稱 <p-sortIcon field="name" /></th>
        <th pSortableColumn="appKey" style="width: 120px">關鍵字 <p-sortIcon field="appKey" /></th>
        <th pSortableColumn="nameOnPartnerMenu">選單顯示名稱 <p-sortIcon field="nameOnPartnerMenu" /></th>
        <th pSortableColumn="displayOrder" style="width: 110px; text-align: center">
          顯示順序 <p-sortIcon field="displayOrder" />
        </th>
        <th style="width: 160px; text-align: center">操作</th>
      </tr>
    </ng-template>
    <ng-template #body let-partner>
      <tr>
        <td>{{ partner.pkid }}</td>
        <td>{{ partner.name }}</td>
        <td>{{ partner.appKey }}</td>
        <td>{{ partner.nameOnPartnerMenu }}</td>
        <td style="text-align: center">{{ partner.displayOrder }}</td>
        <td style="text-align: center; white-space: nowrap">
          <p-button icon="pi pi-eye" [text]="true" severity="secondary" (onClick)="view(partner)" />
          <p-button icon="pi pi-pencil" [text]="true" severity="info" (onClick)="edit(partner)" />
          <p-button icon="pi pi-trash" [text]="true" severity="danger" (onClick)="confirmDelete(partner)" />
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="6" style="text-align: center; color: #94a3b8">查無資料</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-drawer [(visible)]="filterVisible" header="搜尋條件" position="right" styleClass="filter-drawer">
  <div class="field">
    <label class="field-label" for="keyword">關鍵字</label>
    <input
      pInputText
      id="keyword"
      class="w-full"
      [(ngModel)]="filters.keyword"
      placeholder="廠商名稱／關鍵字／顯示名稱"
      (keyup.enter)="applyFilters()" />
  </div>
  <div class="drawer-actions">
    <p-button label="清除" severity="secondary" [outlined]="true" (onClick)="clearFilters()" />
    <p-button label="搜尋" icon="pi pi-search" (onClick)="applyFilters()" />
  </div>
</p-drawer>
