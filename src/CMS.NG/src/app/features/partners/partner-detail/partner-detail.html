<div class="page-toolbar">
  <div class="page-title">
    <h2>檢視合作廠商</h2>
    @if (partner(); as p) {
      <span class="subtitle">{{ p.name }}</span>
      <app-row-audit-badge tableName="Partner" [pkid]="p.pkid" />
    }
  </div>
  <div class="toolbar-actions">
    <p-button label="返回" icon="pi pi-arrow-left" severity="secondary" [outlined]="true" (onClick)="back()" />
    <p-button label="編輯" icon="pi pi-pencil" (onClick)="edit()" />
  </div>
</div>

@if (partner(); as p) {
  <div class="page-card">
    <h3 class="section-title">合作廠商資料</h3>
    <div class="detail-grid">
      <div class="detail-item">
        <span class="detail-label">主代碼</span>
        <span class="detail-value">{{ p.pkid }}</span>
      </div>
      <div class="detail-item">
        <span class="detail-label">廠商名稱</span>
        <span class="detail-value">{{ p.name }}</span>
      </div>
      <div class="detail-item">
        <span class="detail-label">關鍵字</span>
        <span class="detail-value">{{ p.appKey }}</span>
      </div>
      <div class="detail-item">
        <span class="detail-label">顯示順序</span>
        <span class="detail-value">{{ p.displayOrder }}</span>
      </div>
      <div class="detail-item full">
        <span class="detail-label">選單顯示名稱</span>
        <span class="detail-value">{{ p.nameOnPartnerMenu }}</span>
      </div>
      <div class="detail-item">
        <span class="detail-label">課程頁顯示名稱</span>
        <span class="detail-value">{{ p.nameOnCourseDetailPage }}</span>
      </div>
      <div class="detail-item">
        <span class="detail-label">圖片檔名</span>
        <span class="detail-value">{{ p.imageFilename || '—' }}</span>
      </div>
    </div>
  </div>
} @else if (!loading()) {
  <div class="page-card">查無資料</div>
}
