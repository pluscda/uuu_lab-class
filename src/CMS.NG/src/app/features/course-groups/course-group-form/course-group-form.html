<form [formGroup]="form" (ngSubmit)="save()">
  <div class="page-toolbar">
    <div class="page-title">
      <h2>{{ isEdit() ? '編輯課程群組' : '新增課程群組' }}</h2>
    </div>
    <div class="toolbar-actions">
      <p-button
        label="取消"
        icon="pi pi-times"
        severity="secondary"
        [outlined]="true"
        (onClick)="cancel()" />
      <p-button label="儲存" icon="pi pi-check" type="submit" [loading]="saving()" />
    </div>
  </div>

  <div class="page-card">
    <h3 class="section-title">課程群組資料</h3>

    <div class="field">
      <label class="field-label" for="description">群組說明<span class="required">*</span></label>
      <input pInputText id="description" class="w-full" maxlength="100" formControlName="description" placeholder="請輸入群組說明" />
      @if (form.controls.description.touched && form.controls.description.hasError('required')) {
        <div class="field-error">群組說明為必填</div>
      }
    </div>
  </div>
</form>
