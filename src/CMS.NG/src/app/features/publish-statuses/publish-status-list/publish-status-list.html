<div class="page-card">
  <div class="page-toolbar">
    <div class="page-title">
      <h2>發布狀態 PublishStatus</h2>
      <span class="subtitle">內容發布狀態代碼</span>
    </div>
    <div class="toolbar-actions">
      <p-button
        label="搜尋條件"
        icon="pi pi-filter"
        severity="secondary"
        [outlined]="true"
        (onClick)="filterVisible.set(true)" />
      <p-button label="新增" icon="pi pi-plus" (onClick)="add()" />
    </div>
  </div>

  <p-table
    [value]="statuses()"
    [loading]="loading()"
    [paginator]="true"
    paginatorPosition="top"
    [rows]="rows"
    [first]="first"
    [rowsPerPageOptions]="[10, 20, 50]"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first}–{last} 筆，共 {totalRecords} 筆"
    [sortField]="sortField"
    [sortOrder]="sortOrder"
    (onSort)="onSort($event)"
    (onPage)="onPage($event)"
    dataKey="pkid">
    <ng-template #header>
      <tr>
        <th pSortableColumn="pkid" style="width: 90px">主代碼 <p-sortIcon field="pkid" /></th>
        <th pSortableColumn="description">狀態說明 <p-sortIcon field="description" /></th>
        <th pSortableColumn="isDraft" style="width: 110px; text-align: center">
          草稿 <p-sortIcon field="isDraft" />
        </th>
        <th pSortableColumn="isPublished" style="width: 110px; text-align: center">
          已發布 <p-sortIcon field="isPublished" />
        </th>
        <th pSortableColumn="isDiscontinued" style="width: 110px; text-align: center">
          已下架 <p-sortIcon field="isDiscontinued" />
        </th>
        <th style="width: 160px; text-align: center">操作</th>
      </tr>
    </ng-template>
    <ng-template #body let-status>
      <tr>
        <td>{{ status.pkid }}</td>
        <td>{{ status.description }}</td>
        <td style="text-align: center">
          <p-tag [value]="status.isDraft ? '是' : '否'" [severity]="status.isDraft ? 'success' : 'secondary'" />
        </td>
        <td style="text-align: center">
          <p-tag [value]="status.isPublished ? '是' : '否'" [severity]="status.isPublished ? 'success' : 'secondary'" />
        </td>
        <td style="text-align: center">
          <p-tag [value]="status.isDiscontinued ? '是' : '否'" [severity]="status.isDiscontinued ? 'success' : 'secondary'" />
        </td>
        <td style="text-align: center; white-space: nowrap">
          <p-button icon="pi pi-eye" [text]="true" severity="secondary" (onClick)="view(status)" />
          <p-button icon="pi pi-pencil" [text]="true" severity="info" (onClick)="edit(status)" />
          <p-button icon="pi pi-trash" [text]="true" severity="danger" (onClick)="confirmDelete(status)" />
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="6" style="text-align: center; color: #94a3b8">查無資料</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-drawer [(visible)]="filterVisible" header="搜尋條件" position="right" styleClass="filter-drawer">
  <div class="field">
    <label class="field-label" for="keyword">關鍵字</label>
    <input
      pInputText
      id="keyword"
      class="w-full"
      [(ngModel)]="filters.keyword"
      placeholder="狀態說明"
      (keyup.enter)="applyFilters()" />
  </div>
  <div class="field">
    <label class="field-label" for="isDraft">草稿</label>
    <p-select
      inputId="isDraft"
      [(ngModel)]="filters.isDraft"
      [options]="boolOptions"
      optionLabel="label"
      optionValue="value"
      appendTo="body"
      styleClass="w-full" />
  </div>
  <div class="field">
    <label class="field-label" for="isPublished">已發布</label>
    <p-select
      inputId="isPublished"
      [(ngModel)]="filters.isPublished"
      [options]="boolOptions"
      optionLabel="label"
      optionValue="value"
      appendTo="body"
      styleClass="w-full" />
  </div>
  <div class="field">
    <label class="field-label" for="isDiscontinued">已下架</label>
    <p-select
      inputId="isDiscontinued"
      [(ngModel)]="filters.isDiscontinued"
      [options]="boolOptions"
      optionLabel="label"
      optionValue="value"
      appendTo="body"
      styleClass="w-full" />
  </div>
  <div class="drawer-actions">
    <p-button label="清除" severity="secondary" [outlined]="true" (onClick)="clearFilters()" />
    <p-button label="搜尋" icon="pi pi-search" (onClick)="applyFilters()" />
  </div>
</p-drawer>
