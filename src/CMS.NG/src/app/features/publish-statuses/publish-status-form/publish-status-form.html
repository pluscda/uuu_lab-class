<form [formGroup]="form" (ngSubmit)="save()">
  <div class="page-toolbar">
    <div class="page-title">
      <h2>{{ isEdit() ? '編輯發布狀態' : '新增發布狀態' }}</h2>
      @if (pkid() !== null) {
        <app-row-audit-badge tableName="PublishStatus" [pkid]="pkid()!" />
      }
    </div>
    <div class="toolbar-actions">
      <p-button
        label="取消"
        icon="pi pi-times"
        severity="secondary"
        [outlined]="true"
        (onClick)="cancel()" />
      <p-button label="儲存" icon="pi pi-check" type="submit" [loading]="saving()" />
    </div>
  </div>

  <div class="page-card">
    <h3 class="section-title">發布狀態資料</h3>

    <div class="field">
      <label class="field-label" for="pkid">主代碼<span class="required">*</span></label>
      <p-inputnumber
        inputId="pkid"
        formControlName="pkid"
        [useGrouping]="false"
        [min]="0"
        [max]="255"
        placeholder="請輸入主代碼（0–255）"
        styleClass="w-full" />
      @if (form.controls.pkid.touched && form.controls.pkid.hasError('required')) {
        <div class="field-error">主代碼為必填</div>
      }
    </div>

    <div class="field">
      <label class="field-label" for="description">狀態說明<span class="required">*</span></label>
      <input pInputText id="description" class="w-full" maxlength="50" formControlName="description" placeholder="請輸入狀態說明" />
      @if (form.controls.description.touched && form.controls.description.hasError('required')) {
        <div class="field-error">狀態說明為必填</div>
      }
    </div>

    <div class="field">
      <div class="checkbox-field">
        <p-checkbox inputId="isDraft" formControlName="isDraft" [binary]="true" />
        <label class="field-label" for="isDraft">草稿</label>
      </div>
    </div>

    <div class="field">
      <div class="checkbox-field">
        <p-checkbox inputId="isPublished" formControlName="isPublished" [binary]="true" />
        <label class="field-label" for="isPublished">已發布</label>
      </div>
    </div>

    <div class="field">
      <div class="checkbox-field">
        <p-checkbox inputId="isDiscontinued" formControlName="isDiscontinued" [binary]="true" />
        <label class="field-label" for="isDiscontinued">已下架</label>
      </div>
    </div>
  </div>
</form>
