<div class="page-toolbar">
  <div class="page-title">
    <h2>檢視發布狀態</h2>
    @if (status(); as s) {
      <span class="subtitle">{{ s.description }}</span>
    }
  </div>
  <div class="toolbar-actions">
    <p-button label="返回" icon="pi pi-arrow-left" severity="secondary" [outlined]="true" (onClick)="back()" />
    <p-button label="編輯" icon="pi pi-pencil" (onClick)="edit()" />
  </div>
</div>

@if (status(); as s) {
  <div class="page-card">
    <h3 class="section-title">發布狀態資料</h3>
    <div class="detail-grid">
      <div class="detail-item">
        <span class="detail-label">主代碼</span>
        <span class="detail-value">{{ s.pkid }}</span>
      </div>
      <div class="detail-item">
        <span class="detail-label">狀態說明</span>
        <span class="detail-value">{{ s.description }}</span>
      </div>
      <div class="detail-item">
        <span class="detail-label">草稿</span>
        <span class="detail-value">
          <p-tag [value]="s.isDraft ? '是' : '否'" [severity]="s.isDraft ? 'success' : 'secondary'" />
        </span>
      </div>
      <div class="detail-item">
        <span class="detail-label">已發布</span>
        <span class="detail-value">
          <p-tag [value]="s.isPublished ? '是' : '否'" [severity]="s.isPublished ? 'success' : 'secondary'" />
        </span>
      </div>
      <div class="detail-item">
        <span class="detail-label">已下架</span>
        <span class="detail-value">
          <p-tag [value]="s.isDiscontinued ? '是' : '否'" [severity]="s.isDiscontinued ? 'success' : 'secondary'" />
        </span>
      </div>
    </div>
  </div>
} @else if (!loading()) {
  <div class="page-card">查無資料</div>
}
