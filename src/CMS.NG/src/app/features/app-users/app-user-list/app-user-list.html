<div class="page-card">
  <div class="page-toolbar">
    <div class="page-title">
      <h2>使用者 AppUser</h2>
      <span class="subtitle">系統登入使用者帳號</span>
    </div>
    <div class="toolbar-actions">
      <p-button
        label="搜尋條件"
        icon="pi pi-filter"
        severity="secondary"
        [outlined]="true"
        (onClick)="filterVisible.set(true)" />
      <p-button label="新增" icon="pi pi-plus" (onClick)="add()" />
    </div>
  </div>

  <p-table
    [value]="users()"
    [loading]="loading()"
    [paginator]="true"
    paginatorPosition="top"
    [rows]="rows"
    [first]="first"
    [rowsPerPageOptions]="[10, 20, 50]"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first}–{last} 筆，共 {totalRecords} 筆"
    [sortField]="sortField"
    [sortOrder]="sortOrder"
    (onSort)="onSort($event)"
    (onPage)="onPage($event)"
    dataKey="userId">
    <ng-template #header>
      <tr>
        <th pSortableColumn="pkid" style="width: 90px">主代碼 <p-sortIcon field="pkid" /></th>
        <th pSortableColumn="userId">使用者代碼 <p-sortIcon field="userId" /></th>
        <th pSortableColumn="userName">使用者名稱 <p-sortIcon field="userName" /></th>
        <th pSortableColumn="isActive" style="width: 110px; text-align: center">
          是否啟用 <p-sortIcon field="isActive" />
        </th>
        <th pSortableColumn="passwordUpdatedTime" style="width: 170px">
          密碼更新時間 <p-sortIcon field="passwordUpdatedTime" />
        </th>
        <th pSortableColumn="roleCount" style="width: 100px; text-align: center">
          角色數 <p-sortIcon field="roleCount" />
        </th>
        <th style="width: 160px; text-align: center">操作</th>
      </tr>
    </ng-template>
    <ng-template #body let-user>
      <tr>
        <td>{{ user.pkid }}</td>
        <td>{{ user.userId }}</td>
        <td>{{ user.userName }}</td>
        <td style="text-align: center">
          <p-tag [value]="user.isActive ? '啟用' : '停用'" [severity]="user.isActive ? 'success' : 'secondary'" />
        </td>
        <td>{{ user.passwordUpdatedTime ? (user.passwordUpdatedTime + 'Z' | date: 'yyyy/MM/dd HH:mm') : '—' }}</td>
        <td style="text-align: center">{{ user.roleCount }}</td>
        <td style="text-align: center; white-space: nowrap">
          <p-button icon="pi pi-eye" [text]="true" severity="secondary" (onClick)="view(user)" />
          <p-button icon="pi pi-pencil" [text]="true" severity="info" (onClick)="edit(user)" />
          <p-button icon="pi pi-trash" [text]="true" severity="danger" (onClick)="confirmDelete(user)" />
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="7" style="text-align: center; color: #64748b">查無資料</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-drawer [(visible)]="filterVisible" header="搜尋條件" position="right" styleClass="filter-drawer">
  <div class="field">
    <label class="field-label" for="keyword">關鍵字</label>
    <input
      pInputText
      id="keyword"
      class="w-full"
      [(ngModel)]="filters.keyword"
      placeholder="使用者代碼／使用者名稱"
      (keyup.enter)="applyFilters()" />
  </div>
  <div class="field">
    <label class="field-label" for="isActive">是否啟用</label>
    <p-select
      inputId="isActive"
      [(ngModel)]="filters.isActive"
      [options]="activeOptions"
      optionLabel="label"
      optionValue="value"
      appendTo="body"
      styleClass="w-full" />
  </div>
  <div class="field">
    <label class="field-label" for="passwordUpdatedTimeFrom">密碼更新時間（起）</label>
    <p-datepicker
      inputId="passwordUpdatedTimeFrom"
      [(ngModel)]="passwordUpdatedTimeFrom"
      dateFormat="yy-mm-dd"
      appendTo="body"
      [showClear]="true"
      styleClass="w-full" />
  </div>
  <div class="field">
    <label class="field-label" for="passwordUpdatedTimeTo">密碼更新時間（迄）</label>
    <p-datepicker
      inputId="passwordUpdatedTimeTo"
      [(ngModel)]="passwordUpdatedTimeTo"
      dateFormat="yy-mm-dd"
      appendTo="body"
      [showClear]="true"
      styleClass="w-full" />
  </div>
  <div class="drawer-actions">
    <p-button label="清除" severity="secondary" [outlined]="true" (onClick)="clearFilters()" />
    <p-button label="搜尋" icon="pi pi-search" (onClick)="applyFilters()" />
  </div>
</p-drawer>
