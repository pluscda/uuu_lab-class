<div class="page-card">
  <div class="page-toolbar">
    <div class="page-title">
      <h2>角色 AppRole</h2>
      <span class="subtitle">使用者角色</span>
    </div>
    <div class="toolbar-actions">
      <p-button
        label="搜尋條件"
        icon="pi pi-filter"
        severity="secondary"
        [outlined]="true"
        (onClick)="filterVisible.set(true)" />
      <p-button label="新增" icon="pi pi-plus" (onClick)="add()" />
    </div>
  </div>

  <p-table
    [value]="roles()"
    [loading]="loading()"
    [paginator]="true"
    paginatorPosition="top"
    [rows]="rows"
    [first]="first"
    [rowsPerPageOptions]="[10, 20, 50]"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first}–{last} 筆，共 {totalRecords} 筆"
    [sortField]="sortField"
    [sortOrder]="sortOrder"
    (onSort)="onSort($event)"
    (onPage)="onPage($event)"
    dataKey="roleId">
    <ng-template #header>
      <tr>
        <th pSortableColumn="pkid" style="width: 90px">主代碼 <p-sortIcon field="pkid" /></th>
        <th pSortableColumn="roleId">角色代碼 <p-sortIcon field="roleId" /></th>
        <th pSortableColumn="roleName">角色名稱 <p-sortIcon field="roleName" /></th>
        <th pSortableColumn="permissionLevel" style="width: 110px; text-align: center">
          權限等級 <p-sortIcon field="permissionLevel" />
        </th>
        <th pSortableColumn="description">描述 <p-sortIcon field="description" /></th>
        <th pSortableColumn="userCount" style="width: 110px; text-align: center">
          使用者數 <p-sortIcon field="userCount" />
        </th>
        <th style="width: 160px; text-align: center">操作</th>
      </tr>
    </ng-template>
    <ng-template #body let-role>
      <tr>
        <td>{{ role.pkid }}</td>
        <td>{{ role.roleId }}</td>
        <td>{{ role.roleName }}</td>
        <td style="text-align: center">{{ role.permissionLevel }}</td>
        <td>{{ role.description }}</td>
        <td style="text-align: center">{{ role.userCount }}</td>
        <td style="text-align: center; white-space: nowrap">
          <p-button icon="pi pi-eye" [text]="true" severity="secondary" (onClick)="view(role)" />
          <p-button icon="pi pi-pencil" [text]="true" severity="info" (onClick)="edit(role)" />
          <p-button icon="pi pi-trash" [text]="true" severity="danger" (onClick)="confirmDelete(role)" />
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="7" style="text-align: center; color: #94a3b8">查無資料</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-drawer [(visible)]="filterVisible" header="搜尋條件" position="right" styleClass="filter-drawer">
  <div class="field">
    <label class="field-label" for="keyword">關鍵字</label>
    <input
      pInputText
      id="keyword"
      class="w-full"
      [(ngModel)]="filters.keyword"
      placeholder="角色代碼／角色名稱／描述"
      (keyup.enter)="applyFilters()" />
  </div>
  <div class="field">
    <label class="field-label" for="permissionLevelFrom">權限等級（起）</label>
    <p-inputnumber
      inputId="permissionLevelFrom"
      [(ngModel)]="filters.permissionLevelFrom"
      [useGrouping]="false"
      styleClass="w-full" />
  </div>
  <div class="field">
    <label class="field-label" for="permissionLevelTo">權限等級（迄）</label>
    <p-inputnumber
      inputId="permissionLevelTo"
      [(ngModel)]="filters.permissionLevelTo"
      [useGrouping]="false"
      styleClass="w-full" />
  </div>
  <div class="drawer-actions">
    <p-button label="清除" severity="secondary" [outlined]="true" (onClick)="clearFilters()" />
    <p-button label="搜尋" icon="pi pi-search" (onClick)="applyFilters()" />
  </div>
</p-drawer>
